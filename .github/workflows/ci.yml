name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --workspace --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hars .
      - name: Smoke test the image
        run: |
          docker run -d --name hars -p 8123:8123 hars
          for i in $(seq 1 50); do curl -sf localhost:8123/api/ && break; sleep 0.1; done
          curl -sf localhost:8123/api/ | grep -q "API running."
          # A client stuck mid-request must not push shutdown past the grace period.
          exec 3<>/dev/tcp/127.0.0.1/8123
          printf 'POST /api/states/sensor.x HTTP/1.1\r\nHost: x\r\nContent-Type: application/json\r\nContent-Length: 100\r\n\r\n{' >&3
          docker stop -t 10 hars
          test "$(docker inspect hars --format '{{.State.ExitCode}}')" = 0
          docker logs hars 2>&1 | grep -q "hars stopped"
          echo "image: $(docker image inspect hars --format '{{.Size}}') bytes"
