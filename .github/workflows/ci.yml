name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s scripts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hars .
      - name: Smoke test the image
        run: |
          docker run --rm -v hars-ci:/config hars auth add ci ci-password
          docker run -d --name hars -p 8123:8123 -v hars-ci:/config hars
          for i in $(seq 1 50); do curl -s -o /dev/null localhost:8123/api/ && break; sleep 0.1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8123/api/)" = 401
          token=$(scripts/hars-token.sh http://localhost:8123 ci ci-password)
          curl -sf -H "Authorization: Bearer $token" localhost:8123/api/ | grep -q "API running."
          # The bundled frontend: rendered index, and a precompressed asset it links.
          curl -sf localhost:8123/lovelace/0 | grep -q 'content="#2980b9"'
          js=$(curl -sf localhost:8123/ | grep -oE '/frontend_latest/core\.[0-9a-f]+\.js' | head -1)
          curl -sf -o /dev/null -D - -H 'Accept-Encoding: br' "localhost:8123$js" | grep -qi '^content-encoding: br'
          # A client stuck mid-request must not push shutdown past the grace period.
          exec 3<>/dev/tcp/127.0.0.1/8123
          printf 'POST /auth/login_flow HTTP/1.1\r\nHost: x\r\nContent-Type: application/json\r\nContent-Length: 100\r\n\r\n{' >&3
          docker stop -t 10 hars
          test "$(docker inspect hars --format '{{.State.ExitCode}}')" = 0
          docker logs hars 2>&1 | grep -q "hars stopped"
          echo "image: $(docker image inspect hars --format '{{.Size}}') bytes"
      # The budgets in docs/PERF.md, on the image's binary: size, start-up,
      # and idle RSS, CPU and wakeups after a short warm-up. Fails over budget.
      - name: Resource budgets
        run: |
          id=$(docker create hars)
          docker cp "$id":/hars ./hars-bin
          docker rm "$id"
          PERF_GATE=1 scripts/perf.sh ./hars-bin 15 30
