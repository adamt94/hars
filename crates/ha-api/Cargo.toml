[package]
name = "ha-api"
description = "Home Assistant-compatible HTTP API and frontend serving"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
ha-auth.workspace = true
ha-automation.workspace = true
ha-components.workspace = true
ha-integrations.workspace = true
ha-core.workspace = true
ha-http.workspace = true
ha-registry.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
jiff = "0.2.43"
parking_lot = "0.12.5"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "fs", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }
