[package]
name = "ha-api"
description = "Home Assistant-compatible HTTP API and frontend serving"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
ha-auth.workspace = true
ha-core.workspace = true
jiff = "0.2.43"
parking_lot = "0.12.5"
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "fs", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
tracing = "0.1.44"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }
