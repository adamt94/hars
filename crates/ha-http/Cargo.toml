[package]
name = "ha-http"
description = "The outbound HTTPS client hars integrations use"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.154"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util"] }
