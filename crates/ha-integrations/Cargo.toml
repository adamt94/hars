[package]
name = "ha-integrations"
description = "Home Assistant integrations for hars"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["alloc", "salsa20"] }
ha-components.workspace = true
ha-core.workspace = true
ha-http.workspace = true
ha-registry.workspace = true
hmac = "0.12"
jiff = { version = "0.2.43", features = ["serde"] }
parking_lot = "0.12.5"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10"
smol_str = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "rt", "sync", "net", "macros", "process", "io-util"] }
tracing = "0.1.44"

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "test-util", "net", "io-util"] }

[[bench]]
name = "switchbot"
harness = false

[[bench]]
name = "hue_register"
harness = false
