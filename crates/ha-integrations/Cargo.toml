[package]
name = "ha-integrations"
description = "Home Assistant integrations for hars"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ha-core.workspace = true
ha-registry.workspace = true
jiff = "0.2.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util"] }
