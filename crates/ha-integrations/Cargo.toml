[package]
name = "ha-integrations"
description = "Home Assistant integrations for hars"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
ha-components.workspace = true
ha-core.workspace = true
ha-http.workspace = true
ha-registry.workspace = true
hmac = "0.12"
jiff = { version = "0.2.43", features = ["serde"] }
parking_lot = "0.12.5"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "rt", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util", "net", "io-util"] }
