[package]
name = "ha-automation"
description = "Home Assistant's automations: triggers, conditions, actions and modes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ha-components.workspace = true
ha-core.workspace = true
ha-registry.workspace = true
jiff = "0.2.43"
parking_lot = "0.12.5"
rand = "0.9.5"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time", "rt", "sync", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
