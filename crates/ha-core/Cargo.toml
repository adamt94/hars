[package]
name = "ha-core"
description = "Core runtime: event bus, state machine, service registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rand = "0.9.5"
base64 = "0.22.1"
jiff = { version = "0.2.43", features = ["serde"] }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
smol_str = { version = "0.3.2", features = ["serde"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tokio = { version = "1.54.1", features = ["sync", "time", "rt"] }
libyaml-safer = "0.3.0"

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }

[[bench]]
name = "core"
harness = false
