[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/adamt94/homeassistant-rust"
rust-version = "1.85"

[workspace.dependencies]
ha-api = { path = "crates/ha-api" }
ha-auth = { path = "crates/ha-auth" }
ha-automation = { path = "crates/ha-automation" }
ha-components = { path = "crates/ha-components" }
ha-core = { path = "crates/ha-core" }
ha-http = { path = "crates/ha-http" }
ha-integrations = { path = "crates/ha-integrations" }
ha-recorder = { path = "crates/ha-recorder" }
ha-registry = { path = "crates/ha-registry" }

# minijinja 3.1.0 with one change: fuel charges a value's deep size when
# it is made (vendor/minijinja/HARS.md).
[patch.crates-io]
minijinja = { path = "vendor/minijinja" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Performance is the product: optimise release builds hard.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Templates render on a subscription, not per state write: minijinja is
# built for size: 328,336 bytes smaller than opt-level 3, 1.1 µs per render
# either way (docs/perf/RESULTS.md).
[profile.release.package.minijinja]
opt-level = "z"

# Fast-to-build, still-optimised profile for profiling/benchmarks.
[profile.profiling]
inherits = "release"
debug = true
strip = false
