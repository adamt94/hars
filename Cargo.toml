[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/adamt94/homeassistant-rust"
rust-version = "1.85"

[workspace.dependencies]
ha-api = { path = "crates/ha-api" }
ha-auth = { path = "crates/ha-auth" }
ha-automation = { path = "crates/ha-automation" }
ha-components = { path = "crates/ha-components" }
ha-core = { path = "crates/ha-core" }
ha-http = { path = "crates/ha-http" }
ha-integrations = { path = "crates/ha-integrations" }
ha-registry = { path = "crates/ha-registry" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Performance is the product: optimise release builds hard.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast-to-build, still-optimised profile for profiling/benchmarks.
[profile.profiling]
inherits = "release"
debug = true
strip = false
