<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">hars: Home Assistant's core, rebuilt in Rust</title>
  <desc id="d">The hars logo, a house with a gear inside, beside the line "Home Assistant's core, rebuilt in Rust. Your whole smart home in about 11 MiB of memory." Three labels read: 19 times less memory, 15 times faster start-up, same app and dashboards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1613"/>
      <stop offset="1" stop-color="#2a1c14"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f58a4b"/>
      <stop offset="1" stop-color="#e2581f"/>
    </linearGradient>
    <clipPath id="card"><rect width="880" height="280" rx="16"/></clipPath>
    <!-- The mark: a house with a gear inside, drawn in a 64 x 64 box. -->
    <g id="house">
      <path d="M32 7 58 29v24a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V29Z" stroke-linejoin="round" stroke-width="4"/>
    </g>
    <g id="gear">
      <g id="teeth">
        <rect x="29.5" y="24.5" width="5" height="7" rx="1.2"/>
        <rect x="29.5" y="24.5" width="5" height="7" rx="1.2" transform="rotate(45 32 39)"/>
        <rect x="29.5" y="24.5" width="5" height="7" rx="1.2" transform="rotate(90 32 39)"/>
        <rect x="29.5" y="24.5" width="5" height="7" rx="1.2" transform="rotate(135 32 39)"/>
        <rect x="29.5" y="24.5" width="5" height="7" rx="1.2" transform="rotate(180 32 39)"/>
        <rect x="29.5" y="24.5" width="5" height="7" rx="1.2" transform="rotate(225 32 39)"/>
        <rect x="29.5" y="24.5" width="5" height="7" rx="1.2" transform="rotate(270 32 39)"/>
        <rect x="29.5" y="24.5" width="5" height="7" rx="1.2" transform="rotate(315 32 39)"/>
      </g>
      <circle cx="32" cy="39" r="10"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="280" fill="url(#bg)"/>

    <!-- A large, faint copy of the mark, cut off by the right edge. -->
    <g transform="translate(590 -6) scale(5.4)" opacity="0.09">
      <use href="#house" fill="none" stroke="#f58a4b" stroke-width="1.6"/>
      <g fill="none" stroke="#f58a4b" stroke-width="1.6">
        <circle cx="32" cy="39" r="10"/>
        <circle cx="32" cy="39" r="4"/>
      </g>
    </g>

    <!-- Logo and name. -->
    <g transform="translate(56 50) scale(1.25)">
      <use href="#house" fill="url(#mark)" stroke="url(#mark)"/>
      <use href="#gear" fill="#1b1613"/>
      <circle cx="32" cy="39" r="4.2" fill="#f0763a"/>
    </g>
    <text x="156" y="113" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-2">hars</text>
    <text x="330" y="113" font-size="17" fill="#b9a99b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">homeassistant-rust</text>

    <!-- What it is. -->
    <text x="58" y="168" font-size="25" font-weight="600" fill="#ffffff">Home Assistant's core, rebuilt in Rust.</text>
    <text x="58" y="197" font-size="17" fill="#cfc2b6">Your whole smart home in about 11 MiB of memory.</text>

    <!-- Three facts. Each label has room for wider fonts. -->
    <g font-size="14" font-weight="600" fill="#ffd9c2">
      <rect x="58" y="220" width="178" height="30" rx="15" fill="#f0763a" fill-opacity="0.16" stroke="#f0763a" stroke-opacity="0.45"/>
      <text x="147" y="240" text-anchor="middle">19× less memory</text>
      <rect x="248" y="220" width="204" height="30" rx="15" fill="#f0763a" fill-opacity="0.16" stroke="#f0763a" stroke-opacity="0.45"/>
      <text x="350" y="240" text-anchor="middle">15× faster start-up</text>
      <rect x="464" y="220" width="236" height="30" rx="15" fill="#f0763a" fill-opacity="0.16" stroke="#f0763a" stroke-opacity="0.45"/>
      <text x="582" y="240" text-anchor="middle">Same app and dashboards</text>
    </g>
  </g>
</svg>
