<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" width="800" height="416" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">hars and Home Assistant on the same home</title>
  <desc id="d">Four comparisons from one host with the same devices and automations. Memory: Home Assistant 203 MiB, hars 11.1 MiB. Start-up time: Home Assistant 5.85 seconds, hars 0.59 seconds. CPU, as a share of one core: Home Assistant 0.199 percent, hars 0.015 percent. Wakeups per second: Home Assistant 3.4, hars 0.65.</desc>
  <!--
    Numbers: docs/perf/RESULTS.md, "Reference install again, 2026-11-20".
    Each bar is 160 px for the Home Assistant value. The hars bar is
    160 * hars / Home Assistant: 8.7, 16.1, 12.1 and 30.6 px.
  -->
  <style>
    .surface { fill: #fcfcfb; }
    .ring    { fill: none; stroke: #0b0b0b; stroke-opacity: 0.10; }
    .rule    { stroke: #e1e0d9; }
    .ink     { fill: #0b0b0b; }
    .ink2    { fill: #52514e; }
    .ha      { fill: #a9a8a0; }
    .hars    { fill: #eb6834; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ring    { stroke: #ffffff; }
      .rule    { stroke: #2c2c2a; }
      .ink     { fill: #f0efec; }
      .ink2    { fill: #c3c2b7; }
      .ha      { fill: #6b6a65; }
      .hars    { fill: #d95926; }
    }
    .title { font-size: 20px; font-weight: 600; }
    .sub   { font-size: 14px; }
    .label { font-size: 14px; font-weight: 600; }
    .hero  { font-size: 30px; font-weight: 650; }
    .name  { font-size: 13px; }
    .value { font-size: 13px; font-weight: 600; }
    .note  { font-size: 12px; }
  </style>

  <rect class="surface" width="800" height="416" rx="12"/>
  <rect class="ring" x="0.5" y="0.5" width="799" height="415" rx="11.5"/>

  <text class="title ink" x="32" y="50">One real home, measured twice</text>
  <text class="sub ink2" x="32" y="74">The same host, devices and automations. Shorter bars are better.</text>

  <!-- Legend. -->
  <rect class="ha" x="560" y="38" width="12" height="12" rx="3"/>
  <text class="name ink2" x="578" y="49">Home Assistant</text>
  <rect class="hars" x="700" y="38" width="12" height="12" rx="3"/>
  <text class="name ink2" x="718" y="49">hars</text>

  <line class="rule" x1="32" y1="232" x2="768" y2="232"/>
  <line class="rule" x1="400" y1="104" x2="400" y2="356"/>

  <!-- Memory. -->
  <g transform="translate(32 104)">
    <text class="label ink2" y="14">Memory</text>
    <text class="hero ink" y="52">18× less</text>
    <text class="name ink2" y="81">Home Assistant</text>
    <path class="ha" d="M108 70h156a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-156Z"/>
    <text class="value ink" x="276" y="81">203 MiB</text>
    <text class="name ink2" y="103">hars</text>
    <path class="hars" d="M108 92h4.7a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-4.7Z"/>
    <text class="value ink" x="124.7" y="103">11.1 MiB</text>
  </g>

  <!-- Start-up time. -->
  <g transform="translate(432 104)">
    <text class="label ink2" y="14">Start-up time</text>
    <text class="hero ink" y="52">10× faster</text>
    <text class="name ink2" y="81">Home Assistant</text>
    <path class="ha" d="M108 70h156a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-156Z"/>
    <text class="value ink" x="276" y="81">5.85 s</text>
    <text class="name ink2" y="103">hars</text>
    <path class="hars" d="M108 92h12.1a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-12.1Z"/>
    <text class="value ink" x="132.1" y="103">0.59 s</text>
  </g>

  <!-- CPU at rest. -->
  <g transform="translate(32 250)">
    <text class="label ink2" y="14">CPU, share of one core</text>
    <text class="hero ink" y="52">13× less</text>
    <text class="name ink2" y="81">Home Assistant</text>
    <path class="ha" d="M108 70h156a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-156Z"/>
    <text class="value ink" x="276" y="81">0.199 %</text>
    <text class="name ink2" y="103">hars</text>
    <path class="hars" d="M108 92h8.1a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-8.1Z"/>
    <text class="value ink" x="128.1" y="103">0.015 %</text>
  </g>

  <!-- Wakeups. -->
  <g transform="translate(432 250)">
    <text class="label ink2" y="14">CPU wakeups each second</text>
    <text class="hero ink" y="52">5× fewer</text>
    <text class="name ink2" y="81">Home Assistant</text>
    <path class="ha" d="M108 70h156a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-156Z"/>
    <text class="value ink" x="276" y="81">3.4</text>
    <text class="name ink2" y="103">hars</text>
    <path class="hars" d="M108 92h26.6a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-26.6Z"/>
    <text class="value ink" x="146.6" y="103">0.65</text>
  </g>

  <line class="rule" x1="32" y1="372" x2="768" y2="372"/>
  <text class="note ink2" x="32" y="395">Home Assistant 2026.6.1 and hars on one machine, with Hue, LIFX, SwitchBot, weather, an iPhone and 4 automations.</text>
</svg>
